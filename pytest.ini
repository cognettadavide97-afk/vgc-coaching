[pytest]
testpaths = tests
; --cov=backend misura quale percentuale del codice in backend/ viene
; davvero eseguita dai test (non solo "i test passano", ma "quanto codice
; toccano"). --cov-report=term-missing aggiunge, per ogni file, i numeri di
; riga MAI eseguiti da nessun test — così un router senza test (es. prima
; di questo fix) si vede subito con una riga "0%", invece di scoprirlo solo
; leggendo il codice a mano. Attivo di default (in addopts) così basta
; lanciare "pytest" come sempre, senza doversi ricordare i flag.
addopts = --cov=backend --cov-report=term-missing
